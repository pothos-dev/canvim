[package]
name = "canvim"
version = "1.0.0"
description = "A JSON Canvas Editor"
authors = ["you"]
edition = "2021"

[lib]
name = "canvim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-cli = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
paste = "1"
notify = { version = "8.2.0", features = ["macos_fsevent"] }
